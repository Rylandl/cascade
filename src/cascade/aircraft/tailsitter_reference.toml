# Two 0.1 m counter-rotating propellers on the leading edge, each washing its own wing half.
# Linear C_T(J) with C_T0 0.09 and J_0 0.6 (thrust map rows n, n^2; columns (V_a/D)^0..2).
# Hover needs about 78% throttle; full throttle gives a thrust-to-weight ratio of 1.6.
[[propellers]]
name = "left_motor"
position_m = [0.06, -0.12, 0.0]
direction_body = [1.0, 0.0, 0.0]
diameter_m = 0.1
thrust_map = [[0.0, -0.15, 0.0], [0.09, 0.0, 0.0]]
torque_coefficient_static = 0.008
spin_direction = 1.0
slipstream_weights = [1.8, 0.0, 0.6, 0.0]
speed_min_rad_s = 0.0
speed_max_rad_s = 1700.0
time_constant_s = 0.05
acceleration_limit_rad_s2 = 30000.0

[[propellers]]
name = "right_motor"
position_m = [0.06, 0.12, 0.0]
direction_body = [1.0, 0.0, 0.0]
diameter_m = 0.1
thrust_map = [[0.0, -0.15, 0.0], [0.09, 0.0, 0.0]]
torque_coefficient_static = 0.008
spin_direction = -1.0
slipstream_weights = [0.0, 1.8, 0.0, 0.6]
speed_min_rad_s = 0.0
speed_max_rad_s = 1700.0
time_constant_s = 0.05
acceleration_limit_rad_s2 = 30000.0
