schema_version = 2
name = "skywalker-x8-panels"
description = "Skywalker X8 flying wing assembled from component surfaces (no [body] table). Geometry: span 2.1 m, reference area 0.75 m2, MAC 0.357 m, 30 deg leading-edge/quarter-chord sweep, CG ~0.44 m aft of the nose, elevons on the outer panels, large tip winglets acting as vertical stabilizers (Gryte et al. ICUAS 2018; Winter et al. EUCASS 2019; Reinhardt et al. ICUAS 2022). Mass, inertia, reference block, and propeller are copied from skywalker_x8.toml. Static per-panel coefficients are fitted by scripts/fit_x8_panels.py to reproduce the published body-block static polynomial (Gryte et al. wind-tunnel column); positions and all rate-affecting quantities are geometry, not fitted, so C_lp, C_mq, C_nr, C_Lq, C_Yp, C_Yr, C_lr, C_np are predictions to compare against the published XFLR5 values. See docs/skywalker-x8.md for the fit residuals and rate-derivative comparison. Fit residual RMS: CX 0.0075, CY 0.0111, CZ 0.0293, Cl 0.0103, Cm 0.0149, Cn 0.0017."

