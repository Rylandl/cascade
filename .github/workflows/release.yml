name: Release candidate

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish verified artifacts to PyPI (requires a matching vVERSION tag)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  validate-request:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag for publication
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          if [[ "$PUBLISH" == true && "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "Publication requires a matching vVERSION tag; use publish=false to verify a branch."
            exit 1
          fi

  verify:
    needs: validate-request
    uses: ./.github/workflows/ci.yml

  publish:
    if: inputs.publish && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cascade-flight
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: cascade-distributions-${{ github.sha }}
          path: release-artifacts
      - name: Verify the tested bytes and exact version tag
        working-directory: release-artifacts
        run: |
          shasum -a 256 -c SHA256SUMS
          python - <<'PY'
          import email
          import os
          import zipfile
          from pathlib import Path
          wheel, = Path("dist").glob("*.whl")
          sdist, = Path("dist").glob("*.tar.gz")
          files = {wheel, sdist}
          entries = {p for p in Path("dist").iterdir()
                     if not (p.name == ".gitignore" and p.is_file())}
          if entries != files or not all(p.is_file() for p in files):
              raise SystemExit("publication requires exactly one wheel and one source distribution")
          with zipfile.ZipFile(wheel) as archive:
              name, = (n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
              metadata = email.message_from_bytes(archive.read(name))
          expected = f"refs/tags/v{metadata['Version']}"
          if os.environ["GITHUB_REF"] != expected:
              raise SystemExit(f"publication requires the exact tag {expected}")
          PY
      - name: Publish the exact verified distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: release-artifacts/dist/
