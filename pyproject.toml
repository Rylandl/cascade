[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cascade-flight"
version = "0.2.0"
description = "Differentiable, batched, full-envelope fixed-wing flight dynamics in JAX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rylandl" }]
requires-python = ">=3.11,<3.14"
dependencies = ["jax>=0.7.0", "scipy>=1.11", "tomli-w>=1.2"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Repository = "https://github.com/Rylandl/cascade"
Documentation = "https://github.com/Rylandl/cascade/tree/main/docs"
Issues = "https://github.com/Rylandl/cascade/issues"

[project.optional-dependencies]
viz = ["mujoco>=3.1"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "mujoco>=3.1", "flatbuffers>=23.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.pytest.ini_options]
markers = ["slow: multi-second closed-loop, tuning, and family tests (deselect with -m \"not slow\")"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
