[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cascade-flight"
version = "0.1.0"
description = "Differentiable, batched, full-envelope fixed-wing flight dynamics in JAX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["jax>=0.7.0", "scipy>=1.11", "tomli-w>=1.2"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/cascade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
